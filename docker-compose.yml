services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartbrief-backend
    ports:
      - "8003:8003"
    env_file:
      - path: /root/multica_workspaces/smartbriefm-deb1926d499b/.env
        required: false
      - path: ./.env
        required: false
    volumes:
      - /root/multica_workspaces/smartbriefm-deb1926d499b/.env:/app/.env.shared:ro
    environment:
      - PORT=8003
      - HOST=0.0.0.0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/api/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - smartbrief-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartbrief-frontend
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - HOSTNAME=0.0.0.0
      - BACKEND_INTERNAL_URL=http://backend:8003
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8003
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - smartbrief-network
    restart: unless-stopped

networks:
  smartbrief-network:
    driver: bridge
